name: Android Debug Build (no secrets)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No signing secrets: ANDROID_KEYSTORE_PATH is left unset, so debug builds use
      # the default Android debug key.
      - name: Unit tests and debug APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:testDebugUnitTest :mobile:assembleDebug :automotive:assembleDebug \
            --stacktrace --console=plain 2>&1 | tee build.log

      # Surface the key errors as annotations so they can be read without a log download.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -nE '^e: |error:|What went wrong|FAILED|Execution failed|Could not' -A4 build.log \
            | head -c 9000 > errors.txt || true
          msg="$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)"
          echo "::error title=gradle-errors::${msg}"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks-${{ github.sha }}
          path: |
            mobile/build/outputs/apk/debug/*.apk
            automotive/build/outputs/apk/debug/*.apk
          if-no-files-found: error
